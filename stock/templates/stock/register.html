{% extends "stock/base.html" %}

{% block title %}注册 — StockX Pro{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card auth-card">
                <div class="card-body text-center p-4">
                    <div class="auth-icon mb-3">🚀</div>
                    <h2 class="auth-title">创建账户</h2>
                    <p class="auth-subtitle">开启你的模拟交易之旅</p>

                    {% if message %}
                    <div class="alert alert-danger text-start">
                        <i class="bi bi-exclamation-triangle"></i> {{ message }}
                    </div>
                    {% endif %}

                    <form method="POST" class="text-start">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control" placeholder="请输入邮箱地址" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">姓氏</label>
                                <input type="text" name="firstname" class="form-control" placeholder="姓">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">名字</label>
                                <input type="text" name="lastname" class="form-control" placeholder="名">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">性别</label>
                            <select name="gender" class="form-select">
                                <option value="Other">不愿透露</option>
                                <option value="Male">男</option>
                                <option value="Female">女</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认密码</label>
                            <input type="password" name="confirmation" class="form-control" placeholder="请再次输入密码" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 mt-2">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-muted">已有账户？<a href="{% url 'login' %}" class="auth-link">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
